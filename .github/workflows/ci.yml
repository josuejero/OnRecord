name: ci

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (e2e)
        run: pnpm --filter @onrecord/e2e exec playwright install --with-deps

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Rebuild better-sqlite3
        run: pnpm rebuild better-sqlite3 -- --build-from-source

      - name: Run promptfoo eval
        run: pnpm eval

      - name: Upload promptfoo eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-eval
          path: eval/results.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: pnpm exec supabase start

      - name: Export Supabase keys
        run: pnpm exec supabase status -o env >> $GITHUB_ENV

      - name: Create web env
        run: |
          cat > apps/web/.env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Reset DB
        run: pnpm supabase:reset

      - name: Seed demo users
        run: pnpm seed:users
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Policy negative tests
        run: pnpm policy:test
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install Playwright browsers (web)
        run: pnpm --filter @onrecord/web exec playwright install --with-deps

      - name: Cross-browser smoke Playwright
        run: pnpm --filter @onrecord/web test:e2e:smoke

      - name: Web Playwright suite (Chromium)
        run: pnpm test:web:e2e -- --project=chromium

      - name: Repo smoke e2e
        run: pnpm e2e

      - name: Lighthouse CI budgets
        run: pnpm lhci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            e2e/playwright-report
            e2e/test-results
