name: ci

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (e2e)
        run: pnpm --filter @onrecord/e2e exec playwright install --with-deps

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Rebuild better-sqlite3
        run: pnpm rebuild better-sqlite3 -- --build-from-source

      - name: Run promptfoo eval
        run: pnpm eval

      - name: Upload promptfoo eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-eval
          path: eval/results.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: pnpm exec supabase start

      - name: Export Supabase keys (map to SUPABASE_*)
        shell: bash
        run: |
          set -euo pipefail

          # Supabase CLI exports API_URL / ANON_KEY / SERVICE_ROLE_KEY by default
          # (and requires the local stack to be started).
          # Retry briefly in case status isn't populated immediately.
          for i in {1..30}; do
            OUT="$(pnpm exec supabase status -o env 2>/dev/null || true)"
            echo "$OUT" | grep -q "SERVICE_ROLE_KEY" && break
            sleep 2
          done

          # Add the CLI vars to the job env (strip optional `export ` prefix if present)
          echo "$OUT" | sed 's/^export //' >> "$GITHUB_ENV"

          # Map to the names your app/seed expects
          echo "$OUT" | sed 's/^export //' > /tmp/supabase.env
          set -a
          . /tmp/supabase.env
          set +a

          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Create web env
        run: |
          cat > apps/web/.env.local <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Reset DB
        run: pnpm supabase:reset

      - name: Seed demo users
        run: pnpm seed:users
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Policy negative tests
        run: pnpm policy:test
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install Playwright browsers (web)
        run: pnpm --filter @onrecord/web exec playwright install --with-deps

      - name: Repo smoke e2e
        run: pnpm e2e
